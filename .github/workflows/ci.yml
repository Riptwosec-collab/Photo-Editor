name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Desktop Chromium release flow
        run: npm run test:e2e -- e2e/editor.spec.ts --project=chromium
      - name: Mobile Pixel release flow
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- e2e/mobile-editor.spec.ts --project=mobile
      - name: Studio navigation and image analysis
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- e2e/studio-upgrade.spec.ts
      - name: Recovery, layers, batch ZIP and language
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- e2e/recoverable-workflows.spec.ts
      - name: Creative tools and recoverable library
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- e2e/creative-library.spec.ts
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
